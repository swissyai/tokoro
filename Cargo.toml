[package]
name = "tokoro"
version = "0.8.0"
edition = "2021"
description = "A place for local models."
license = "MIT OR Apache-2.0"
repository = "https://github.com/swissyai/tokoro"
homepage = "https://tokoro.sh"
readme = "README.md"
rust-version = "1.94.1"
keywords = ["llm", "inference", "local", "tui", "observability"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["design/**"]
publish = false

[package.metadata.dist]
dist = true

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
sysinfo = "0.33"
ureq = { version = "2", features = ["json"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
sha2 = "0.10"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
